policy_id: AX-POL-RISK-0001
version: 0.1.0
date: "2026-08-02"
provenance: human-approved Gate B foundation
status: EXPERIMENTAL
owner: Human Authority
risk: HIGH
enforcement: RUNTIME_ENFORCED_BY_WORKFLOW_RUNNER
evidence:
  - docs/threat_model.md
approval:
  required: true
  state: APPROVED_FOR_EXPERIMENTAL_DOCUMENTATION
levels:
  LOW:
    description: local reversible action with limited impact
    human_gate_required: false
  MEDIUM:
    description: functional or cross-cutting action with moderate impact
    human_gate_required: conditional
  HIGH:
    description: action affecting authority, shared contracts, persistence, or difficult rollback
    human_gate_required: true
  CRITICAL:
    description: destructive, security-sensitive, deployment, migration, or irreversible action
    human_gate_required: true
assessment_factors:
  - reversibility
  - blast_radius
  - data_sensitivity
  - authority_change
  - runtime_certainty
  - rollback_quality
  - evidence_completeness
closed_failure_conditions:
  - authority_conflict
  - ambiguous_identity
  - missing_rollback
  - incomplete_evidence
  - destructive_action_without_gate
  - unknown_runtime
required_for_high_or_critical:
  - written_human_approval
  - explicit_scope
  - executable_check
  - rollback_plan
  - independent_audit
# Exigido solo en CRITICAL, que es la clase donde "asume que fracaso en 6 meses" mas
# paga: acciones destructivas, de seguridad, despliegues, migraciones e irreversibles.
# Para exigirlo tambien en HIGH basta mover esta linea al bloque de arriba; el runner
# no necesita cambiar.
required_for_critical_only:
  - adversarial_premortem
