name: Axion Protocol CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Suites de gobernanza
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # El proyecto no tiene dependencias externas: solo modulos integrados de Node,
      # asi que no hay paso de instalacion.

      # Las 31 suites de una vez. El runner no omite ninguna: la version anterior de
      # este workflow ejecutaba 7 de las 13 de Fase E y dejaba fuera role_separation,
      # que es la sonda de AX-NC-0001. Enumerar suites a mano acaba oxidandose.
      - name: Suite completa
        run: node tests/run_all.js

      # Desglose por tanda si algo falla, para localizarlo sin abrir el log entero.
      - name: Desglose por tanda
        if: failure()
        run: |
          node tests/run_all.js funcional || true
          node tests/run_all.js regresion || true
          node tests/run_all.js phase_e || true
