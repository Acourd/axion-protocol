policy_id: AX-POL-AUTHORITY-0001
version: 0.1.0
date: "2026-08-02"
provenance: human-approved Gate B foundation
status: EXPERIMENTAL
owner: Human Authority
risk: HIGH
enforcement: DOCUMENT_ONLY
evidence:
  - GOVERNANCE.md
approval:
  required: true
  state: APPROVED_FOR_EXPERIMENTAL_DOCUMENTATION
roles:
  human_authority:
    decides:
      - product
      - architecture
      - security
      - promotion
      - retention
      - irreversible_actions
  director:
    may:
      - propose_scope
      - propose_resources
      - request_gates
    may_not:
      - self_approve
      - execute_critical_actions
  executor:
    may:
      - execute_approved_actions
    may_not:
      - expand_scope
      - approve_own_result
  supervisor:
    may:
      - observe
      - pause_on_deviation
      - record_checkpoints
  auditor:
    may:
      - reproduce_checks
      - issue_verdicts
    must_be_independent_from: executor
authority_rules:
  location_grants_authority: false
  existence_implies_activation: false
  conflict_behavior: FAIL_CLOSED
  missing_identity_behavior: FAIL_CLOSED
sources:
  normative_requirements:
    - explicit_identity
    - version
    - owner
    - scope
    - consumer
    - enforcement
    - approval
  informative_only:
    - reports
    - examples
    - lineage_documents
    - historical_evidence
