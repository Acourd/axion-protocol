policy_id: AX-POL-RETENTION-0001
version: 0.1.0
date: "2026-08-02"
provenance: human-approved Gate B foundation
status: EXPERIMENTAL
owner: Human Authority
risk: HIGH
enforcement: DOCUMENT_ONLY
evidence:
  - core/evidence/README.md
approval:
  required: true
  state: APPROVED_FOR_EXPERIMENTAL_DOCUMENTATION
principles:
  evidence_outside_active_runtime: true
  reports_are_instructions: false
  deletion_requires_separate_gate: true
  preserve_provenance: true
required_metadata:
  - evidence_id
  - origin
  - date
  - related_project
  - access_level
  - hash_algorithm
  - hash
  - restoration_instructions
retention_classes:
  CRITICAL:
    duration: until_explicit_human_disposition
    restoration_test_required: true
  GOVERNANCE:
    duration: while_authoritative_and_for_auditable_history
    restoration_test_required: true
  OPERATIONAL:
    duration: policy_defined_per_consumer
    restoration_test_required: conditional
  TEMPORARY:
    duration: until_task_closure_or_explicit_extension
    restoration_test_required: false
deletion_preconditions:
  - canonical_copy_verified
  - hash_pass
  - restoration_pass
  - manifest_pass
  - written_human_approval
failure_behavior: PRESERVE_AND_BLOCK
